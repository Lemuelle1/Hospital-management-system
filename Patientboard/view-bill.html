<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>View Bills</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="header">
        <h1>My Bills</h1>
    </div>

    <div class="container">

        <div class="cards">

            <div class="card">
                <i class="fa fa-file-invoice-dollar"></i>
                <h3>Consultation Bill</h3>
                <p>Date: 12 Aug 2025</p>
                <p>Status: Paid</p>
            </div>

            <div class="card">
                <i class="fa fa-file-invoice-dollar"></i>
                <h3>Laboratory Test</h3>
                <p>Date: 05 Aug 2025</p>
                <p>Status: Unpaid</p>
            </div>

            <div class="card">
                <i class="fa fa-file-invoice-dollar"></i>
                <h3>Medication Bill</h3>
                <p>Date: 30 Jul 2025</p>
                <p>Status: Paid</p>
            </div>

        </div>

        <a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

    </div>

</body>

</html>
