<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMS Login Page</title>

  <link rel="stylesheet" href="patient-login.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
  <div class="wrapper">

    <!-- SINGLE FORM ONLY -->
    <form id="loginForm">
      <h1>Patient Login</h1>

      <div class="input-box">
        <label><i class="bx bxs-user"></i> Username</label>
        <input type="text" id="username" placeholder="Username" required>
      </div>

      <div class="input-box password-wrapper">
        <label><i class="bx bx-lock"></i> Password</label>
        <input type="password" id="password" placeholder="Password" required>
        <i class="bx bx-hide" id="togglePassword"></i>
      </div>

      <div class="input-box">
        <label><i class="bx bx-envelope"></i> Email</label>
        <input type="email" id="email" placeholder="Enter Email" required>
      </div>

      <div class="remember-forgot">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot Password</a>
      </div>

      <button type="submit" class="btn">Login</button>

      <p id="errorMessage" class="error-message"></p>

      <p>
        Don't have an account yet?
        <a href="patient-signup.html">Sign up</a>
      </p>

      <button type="button" class="btn-back" onclick="history.back()">Go Back</button>
      <button type="button" class="btn-cancel" onclick="clearForm()">Cancel</button>
    </form>

  </div>

  <script>
    // Redirect after successful login
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault(); // stop real submission

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Basic validation
      if (!email.includes("@")) {
        showError("Please enter a valid email.");
        return;
      }

      if (password.length < 6) {
        showError("Password must be at least 6 characters.");
        return;
      }

      // ✅ SUCCESS → redirect
      window.location.href = "patient-dashboard.html";
    });

    function showError(message) {
      const error = document.getElementById("errorMessage");
      error.textContent = message;
      error.style.display = "block";
    }

    function clearForm() {
      document.getElementById("loginForm").reset();
      document.getElementById("errorMessage").style.display = "none";
    }

    // Toggle password visibility
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("click", () => {
      const type = passwordInput.type === "password" ? "text" : "password";
      passwordInput.type = type;
      togglePassword.classList.toggle("bx-show");
    });
  </script>
</body>
</html>
