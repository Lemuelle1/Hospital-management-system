<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Change Doctor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Change Doctor</h2>

    <form class="form-card">
        <label>Current Doctor</label>
        <input type="text" value="Dr. John Smith" disabled>

        <label>Select New Doctor</label>
        <select>
    <option>Dr. Alice Brown (Cardiology)</option>
    <option>Dr. Mark Wilson (General)</option>
    <option>Dr. Sarah Lee (Pediatrics)</option>
  </select>

        <label>Reason for Change</label>
        <textarea placeholder="Enter reason..."></textarea>

        <button type="submit">Submit Request</button>
    </form>

    <br>

    <a href="dashboard.html">⬅ Back to Dashboard</a>

</body>

</html>
