<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Download Medical Records</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f0f8ff;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    text-align: center;
}

.page-header h1 {
    color: #0077cc;
    margin-bottom: 10px;
}

.page-header p {
    color: #555;
    margin-bottom: 30px;
}

.record-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.record-card {
    display: flex;
    align-items: center;
    padding: 15px;
    background-color: #ffffff;
    border: 1px solid #ddd;
    border-radius: 8px;
    text-decoration: none;
    color: #333;
    transition: background-color 0.3s ease;
}

.record-card i {
    font-size: 24px;
    margin-right: 10px;
    color: #0077cc;
}

.record-card:hover {
    background-color: #e6f2ff;
}

.back-button {
    margin-top: 30px;
}

.back-button a {
    text-decoration: none;
    color: #0077cc;
    font-weight: bold;
}
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="page-header">
            <h1><i class="fa fa-file-medical"></i> Download Medical Records</h1>
            <p>Select a record to view or download</p>
        </header>

        <!-- Record List -->
        <div class="record-list">

            <a href="#" class="record-card">
                <i class="fa fa-vial"></i>
                <span>Blood Test Report</span>
            </a>

            <a href="#" class="record-card">
                <i class="fa fa-x-ray"></i>
                <span>X-Ray Results</span>
            </a>

            <a href="#" class="record-card">
                <i class="fa fa-prescription-bottle-alt"></i>
                <span>Prescription History</span>
            </a>

            <a href="#" class="record-card">
                <i class="fa fa-calendar-check"></i>
                <span>Appointment Summary</span>
            </a>

            <a href="#" class="record-card">
                <i class="fa fa-download"></i>
                <span>Download Full Record</span>
            </a>

        </div>

        <!-- Back Button -->
        <div class="back-button">
            <a href="patient-dashboard.html"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
        </div>

    </div>

</body>

</html>
