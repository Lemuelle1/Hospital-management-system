<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reception</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f4f6f9;
}

/* Header */
.navbar {
    background-color: #1f3a63;
    padding: 15px 30px;
    color: white;
}

/* Container */
.container {
    padding: 30px;
}

/* Buttons */
.actions {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
}

.btn {
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
    font-size: 15px;
    cursor: pointer;
    color: white;
    background-color: #4CAF88;
}

/* Cards */
.card {
    background: #ffffff;
    padding: 25px;
    border-radius: 6px;
    box-shadow: 0 0 8px rgba(0,0,0,0.1);
    margin-bottom: 25px;
}

.card h2 {
    margin-bottom: 15px;
    color: #1f3a63;
}

/* Forms */
.form-row {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
}

input, select {
    padding: 10px;
    width: 100%;
    border-radius: 5px;
    border: 1px solid #ccc;
}

/* Responsive */
@media (max-width: 768px) {
    .actions {
        flex-direction: column;
    }

    .form-row {
        flex-direction: column;
    }
}

</style>
<header class="navbar">
    <h2>Reception</h2>
</header>

<main class="container">

    <div class="actions">
        <button class="btn">Add patient</button>
        <button class="btn">Discard patient</button>
    </div>

    <!-- Patient Information -->
    <section class="card">
        <h2>Patient Information</h2>

        <div class="form-row">
            <input type="text" placeholder="Full Name">
            <input type="number" placeholder="Age">
        </div>

        <div class="form-row">
            <select>
                <option value="">Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
            <input type="text" placeholder="Contact Number">
        </div>

        <div class="form-row">
            <input type="text" placeholder="Address">
        </div>
    </section>

    <!-- Emergency Contact -->
    <section class="card">
        <h2>Emergency Contact</h2>

        <div class="form-row">
            <input type="text" placeholder="Emergency Contact Name">
            <input type="text" placeholder="Emergency Contact Phone">
        </div>

        <div class="form-row">
            <input type="text" placeholder="Emergency Contact Address">
        </div>
    </section>

</main>

</body>
</html>
