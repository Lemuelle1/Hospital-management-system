<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reception</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <h2>Reception</h2>
</header>

<main class="container">

    <div class="actions">
        <button class="btn">Add patient</button>
        <button class="btn">Discard patient</button>
    </div>

    <!-- Patient Information -->
    <section class="card">
        <h2>Patient Information</h2>

        <div class="form-row">
            <input type="text" placeholder="Full Name">
            <input type="number" placeholder="Age">
        </div>

        <div class="form-row">
            <select>
                <option value="">Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
            <input type="text" placeholder="Contact Number">
        </div>

        <div class="form-row">
            <input type="text" placeholder="Address">
        </div>
    </section>

    <!-- Emergency Contact -->
    <section class="card">
        <h2>Emergency Contact</h2>

        <div class="form-row">
            <input type="text" placeholder="Emergency Contact Name">
            <input type="text" placeholder="Emergency Contact Phone">
        </div>

        <div class="form-row">
            <input type="text" placeholder="Emergency Contact Address">
        </div>
    </section>

</main>

</body>
</html>
