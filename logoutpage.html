<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LogOut</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
            width: 300px;
        }
        
        .box i {
            font-size: 40px;
            color: #2d5be3;
            margin-bottom: 15px;
        }
        
        .box a {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background: #2d5be3;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <i class="fa fa-sign-out-alt"></i>
        <h2>Logged Out</h2>
        <p>You have successfully logged out of HMS.</p>
        <a href="index.html">Login Again</a>
    </div>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</body>

</html>
